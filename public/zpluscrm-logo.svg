<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Blue Gradient for Z & Top Arc -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81" />
      <stop offset="50%" stop-color="#0066D4" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    
    <!-- Light Blue Accent for Z 3D Edge -->
    <linearGradient id="blueLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>

    <!-- Green Gradient for Plus & Bottom Arc -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64DD17" />
      <stop offset="100%" stop-color="#388E3C" />
    </linearGradient>
  </defs>

  <!-- Top Blue Outer Arc -->
  <path d="M 120 220 A 180 180 0 0 1 360 90" fill="none" stroke="url(#blueLight)" stroke-width="18" stroke-linecap="round" />

  <!-- Bottom Green Outer Arc -->
  <path d="M 140 270 A 180 180 0 0 0 380 180" fill="none" stroke="url(#greenGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Stylized Z Symbol -->
  <g transform="translate(130, 95) scale(0.9)">
    <!-- Main Z Body -->
    <path d="M 30 20 L 175 20 L 70 140 L 175 140 L 170 170 L 15 170 L 120 50 L 30 50 Z" fill="url(#blueGrad)" />
    <!-- Z Facet Shading for 3D effect -->
    <path d="M 120 50 L 175 20 L 70 140 Z" fill="url(#blueLight)" opacity="0.4" />
  </g>

  <!-- Green Plus Symbol (+) -->
  <g transform="translate(295, 105)">
    <rect x="25" y="0" width="22" height="70" rx="6" fill="url(#greenGrad)" />
    <rect x="0" y="24" width="72" height="22" rx="6" fill="url(#greenGrad)" />
  </g>

  <!-- Wordmark: zpluscrm -->
  <text x="250" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">
    <tspan fill="#0B2545">zplus</tspan>
    <tspan fill="#54B400">crm</tspan>
  </text>

  <!-- Tagline Line Accents -->
  <line x1="50" y1="415" x2="105" y2="415" stroke="#0052CC" stroke-width="4" stroke-linecap="round" />
  <line x1="395" y1="415" x2="450" y2="415" stroke="#54B400" stroke-width="4" stroke-linecap="round" />

  <!-- Tagline Text: CONNECT. MANAGE. GROW. -->
  <text x="250" y="420" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="18" fill="#1E293B" letter-spacing="4.5">
    CONNECT. MANAGE. GROW.
  </text>
</svg>
